[workspace]
members = ["crates/connector-kit", "connectors/*"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "LicenseRef-Proprietary"
publish = false
repository = "https://github.com/rigspark/connectors"

[workspace.dependencies]
connector-kit = { path = "crates/connector-kit" }
rmcp = { version = "3.9", features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-std", "io-util", "signal", "fs", "net", "sync"] }
reqwest = { version = "0.13", features = ["json", "query", "form", "gzip"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
wiremock = "0.6"
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.4"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
